[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "loopiter"
version = "0.3.0a1"
description = "Lightweight, review-first feedback loops for Python AI applications."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Loopiter contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2,<4"]
openai = ["openai>=2,<3"]
otel = ["opentelemetry-api>=1.45.2,<2", "opentelemetry-sdk>=1.45.2,<2"]
dev = ["build>=1.2,<2", "ruff>=0.12,<1", "twine>=6,<7"]

[project.urls]
Homepage = "https://loopiter.co"
Documentation = "https://loopiter.docs.buildwithfern.com/get-started/python-quickstart"
Repository = "https://github.com/SanaanKhalid/loopiter"
Issues = "https://github.com/SanaanKhalid/loopiter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/loopiter"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.force-include]
"AGENT_GUIDE.md" = "loopiter/AGENT_GUIDE.md"
"examples/__init__.py" = "loopiter/starters/__init__.py"
"examples/autonomous_demo.py" = "loopiter/starters/autonomous_demo.py"
"examples/autonomous_workflows.py" = "loopiter/starters/autonomous_workflows.py"
"examples/autonomous_registry.py" = "loopiter/starters/autonomous_registry.py"
"examples/autonomous_provider.py" = "loopiter/starters/autonomous_provider.py"
"examples/reviewed_loop.py" = "loopiter/starters/reviewed_loop.py"

# Relative docs linked from AGENT_GUIDE.md are copied by hatch_build.py.
# A static force-include of ../docs would be missing when pip builds the wheel from the sdist.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["src", "tests", "examples", "README.md", "AGENT_GUIDE.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml"]

[tool.hatch.build.targets.sdist.hooks.custom]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
