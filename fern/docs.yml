# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: loopiter.docs.buildwithfern.com

title: Loopiter Documentation
default-language: python
favicon: assets/favicon.svg

logo:
  href: https://loopiter.co
  dark: assets/logo-dark.svg
  light: assets/logo-light.svg
  right-text: Docs
  height: 26

colors:
  accent-primary:
    light: "#355400"
    dark: "#c6ff59"
  background:
    light: "#f7f8f5"
    dark: "#070807"
  border:
    light: "#d9ddd4"
    dark: "#292c28"
  sidebar-background:
    light: "#f0f2ed"
    dark: "#0b0d0b"
  header-background:
    light: "#ffffff"
    dark: "#070807"
  card-background:
    light: "#eef1e9"
    dark: "#101310"

theme:
  sidebar: minimal
  body: canvas
  page-actions: toolbar
  footer-nav: minimal

layout:
  # Use the layout option supported by the hosted renderer as well as the CLI.
  tabs-placement: header
  searchbar-placement: header
  mobile-toc: true

navbar-links:
  - type: minimal
    text: Home
    href: https://loopiter.co
  - type: github
    value: https://github.com/SanaanKhalid/loopiter

# Language tabs do not add URL prefixes: existing npm, PyPI and website links stay valid.
tabs:
  python:
    display-name: Python
    icon: brands python
    skip-slug: true
  nodejs:
    display-name: Node.js
    icon: brands node-js
    skip-slug: true

navigation:
  - tab: python
    layout:
      - section: Get started
        contents:
          - page: Overview
            path: pages/overview.mdx
          - page: Python quickstart
            path: pages/python.mdx
          - page: Python examples
            path: pages/python-examples.mdx
          - page: Autonomous improvement in Python
            path: pages/python-autonomy.mdx
          - page: Integrate an improvement workflow
            path: pages/autonomy-integration.mdx
          - page: Architecture
            path: pages/architecture.mdx
          - page: Supported capabilities
            path: pages/supported.mdx
          - page: Release validation
            path: pages/release-validation.mdx
      - section: Closing the loop
        contents:
          - page: Opt-in autonomous improvement
            path: pages/autonomous.mdx
          - page: Autonomy policy reference
            path: pages/autonomy-policy.mdx
          - page: Datasets and evaluation
            path: pages/autonomy-datasets.mdx
          - page: Building application adapters
            path: pages/autonomy-adapters.mdx
          - page: Governed self-improvement
            path: pages/self-improvement.mdx
          - page: Fine-tuning
            path: pages/fine-tuning.mdx
          - page: Agent systems
            path: pages/agent-systems.mdx
      - section: Operate
        contents:
          - link: Python PostgreSQL setup
            href: /get-started/python-quickstart#postgresql-optional
          - page: Security and privacy
            path: pages/security.mdx
          - page: Production operation
            path: pages/production.mdx
          - page: Autonomous operations and recovery
            path: pages/autonomy-operations.mdx
          - page: Migrating to 0.3
            path: pages/autonomy-migration.mdx
      - section: Reference
        contents:
          - page: Python API
            path: pages/python-api.mdx
          - page: Common pitfalls and FAQ
            path: pages/faq.mdx
  - tab: nodejs
    layout:
      - section: Get started
        contents:
          - page: Quickstart
            path: pages/quickstart.mdx
          - page: Classification starter
            path: pages/starter.mdx
          - link: Overview
            href: /get-started/overview
          - link: Integration walkthrough
            href: /get-started/integrate-an-improvement-workflow
          - link: Complete policy reference
            href: /closing-the-loop/autonomy-policy-reference
          - link: Datasets and evaluation
            href: /closing-the-loop/datasets-and-evaluation
          - link: Building application adapters
            href: /closing-the-loop/building-application-adapters
          - link: Operations and recovery
            href: /operate/autonomous-operations-and-recovery
      - section: Core concepts
        contents:
          - page: Executions and episodes
            path: pages/executions.mdx
          - page: Signals and outcomes
            path: pages/signals.mdx
          - page: Pattern analysis
            path: pages/analysis.mdx
          - page: Improvement candidates
            path: pages/candidates.mdx
      - section: Closing the loop
        contents:
          - link: Opt-in autonomous improvement
            href: /closing-the-loop/opt-in-autonomous-improvement
          - page: Evaluation and deployment
            path: pages/evaluation-deployment.mdx
      - section: Operate
        contents:
          - page: Storage adapters
            path: pages/storage.mdx
          - page: Migrating from the prototype
            path: pages/migration.mdx
      - section: Reference
        contents:
          - page: TypeScript API
            path: pages/api-reference.mdx
          - link: Node.js and Python capabilities
            href: /get-started/supported-capabilities
          - link: Migrating to 0.3
            href: /operate/migrating-to-0-3
          - link: Release validation
            href: /get-started/release-validation

css: styles.css
