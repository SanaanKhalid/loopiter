name: Publish Python alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Python version to publish (must match python/pyproject.toml)
        required: true
        default: 0.3.0a1
        type: string
      expected_sha:
        description: Full reviewed main commit SHA; publishing fails if main moved
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: loopiter-pypi-release
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'SanaanKhalid/loopiter' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check exact authorized release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          package = tomllib.loads(pathlib.Path('python/pyproject.toml').read_text())['project']
          assert package['name'] == 'loopiter'
          assert package['version'] == os.environ['RELEASE_VERSION'], 'Version mismatch'
          assert os.environ['GITHUB_SHA'] == os.environ['EXPECTED_SHA'], 'Commit mismatch'
          PY

  validation:
    needs: gate
    uses: ./.github/workflows/alpha.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install './python[dev]'
      - run: python -m build python --outdir dist
      - name: Install and test the exact distributions to be uploaded
        run: python scripts/python-package-smoke.py --artifacts-dir dist
      - name: Record distribution checksums
        run: sha256sum dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [gate, validation, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/loopiter/
    permissions:
      id-token: write
    steps:
      # No source checkout or arbitrary project build code in this credentialed job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Publish via PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true
