name: Deploy Loopiter marketing

on:
  workflow_dispatch:
  push:
    branches: [codex/agent-led-onboarding]
    paths: [.github/workflows/marketing-deploy.yml]

permissions:
  contents: read

concurrency:
  group: loopiter-marketing-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The site build dates pages from git log. A depth-1 checkout omits
          # history for files the tip commit did not touch.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets, then rerun this workflow.'
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Deploy built Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config dist/server/wrangler.json
      - name: Check published routes
        run: |
          base=https://loopiter.co
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null "$base/"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null "$base/docs/"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null "$base/blog"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null "$base/blog/graduated-autonomy-for-self-improving-ai-agents"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null "$base/sitemap.xml"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null "$base/llms.txt"
