name: macOS tests
# Separate from alpha.yml so python-publish, which calls that workflow, never waits on these jobs.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/**
      - infrastructure/**
      - benchmarks/kb-qa/live.ts
      - .github/workflows/macos-tests.yml
permissions:
  contents: read
jobs:
  macos-python:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install './python[dev]'
      - run: ruff check python scripts/python-package-smoke.py scripts/autonomy-report.py
      - run: ruff format --check python scripts/python-package-smoke.py scripts/autonomy-report.py
      - run: python -m unittest discover -s python/tests -v
  macos-node:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
