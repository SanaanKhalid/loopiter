name: Azure deploy order
on:
  pull_request:
    paths:
      - infrastructure/azure/**
      - .github/workflows/azure-deploy-order.yml
  push:
    branches: [main]
    paths:
      - infrastructure/azure/**
      - .github/workflows/azure-deploy-order.yml
permissions:
  contents: read
jobs:
  deploy-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check deploy order
        run: bash infrastructure/azure/deploy-order.test.sh
